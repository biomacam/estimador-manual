[project]
name = "estimador-manual"
version = "0.1.0"
description = "AI-powered software estimation service using Cache Augmented Generation architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
estimador-manual = "estimador_manual:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
